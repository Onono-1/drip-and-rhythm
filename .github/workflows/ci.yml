name: Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start native Ubuntu PostgreSQL service (no containers)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE drip_test WITH LOGIN PASSWORD 'ci_test_only_pw' NOSUPERUSER CREATEDB NOCREATEROLE;"
          sudo -u postgres psql -c "CREATE DATABASE drip_and_rhythm_test OWNER drip_test ENCODING 'UTF8';"
          sudo -u postgres psql -d drip_and_rhythm_test -c "GRANT ALL ON SCHEMA public TO drip_test;"

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies and run Ruff + PostgreSQL tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgresql://drip_test:ci_test_only_pw@127.0.0.1:5432/drip_and_rhythm_test
          TEST_DATABASE_URL: postgresql://drip_test:ci_test_only_pw@127.0.0.1:5432/drip_and_rhythm_test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ruff check .
          python manage.py migrate --noinput
          pytest --create-db

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and verify typecheck, lint, unit tests, and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          DJANGO_INTERNAL_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build
